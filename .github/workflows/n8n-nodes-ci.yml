# n8n-nodes-zynd (packages/n8n-nodes-zynd): lint with the n8n community-node rules, typecheck, tests,
# build, and the size/dependency budget. The Gateway has its own workflow (ci.yml), which also runs the
# package against the Gateway (test/n8nNodes.e2e.test.ts).
name: n8n-nodes CI
on:
  pull_request:
    paths:
      - 'packages/n8n-nodes-zynd/**'
      - 'package-lock.json'
      - '.github/workflows/n8n-nodes-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/n8n-nodes-zynd/**'
      - 'package-lock.json'
      - '.github/workflows/n8n-nodes-ci.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/n8n-nodes-zynd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # One lock-file at the repository root; npm ci installs every workspace.
      - run: npm ci
        working-directory: .
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # M3.8: zero dependencies, MIT, keyword, peer dependency, unpacked size under 50 KB.
      - run: npm run size
