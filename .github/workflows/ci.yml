name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gateway_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - run: npm run lint
      - run: npm run typecheck
      # DB-backed tests: the dashboard's developer_keys table, then the Gateway migrations
      # (twice: re-running must be a no-op).
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f test/fixtures/dashboard-developer-keys.sql
      - run: DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
      - run: DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
      # The package is built first so test/n8nNodes.e2e.test.ts runs the compiled nodes against the Gateway.
      - run: npm run build:nodes
      - run: npm test
      - run: npm run build
      # M0.19: memory guard. Boots the bundle and fails the PR if idle/peak RSS passes the budget.
      - run: DATABASE_URL="$TEST_DATABASE_URL" npm run check:memory
